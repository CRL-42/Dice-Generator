<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Dice Generator</title>
  </head>
  <body>
    <main>
      <h1>Dice Generator</h1>
      <div>
        <h2>Select your dice.</h2>
        <ul class="diceContaine" id="diceBox">
          <li><button class="dice" id="D4">D4</button></li>
          <li><button class="dice" id="D6">D6</button></li>
          <li><button class="dice" id="D8">D8</button></li>
          <li><button class="dice" id="D10">D10</button></li>
          <li><button class="dice" id="D12">D12</button></li>
          <li><button class="dice" id="D20">D20</button></li>
        </ul>
      </div>
      <section>
        <h2>Selected Dice.</h2>
        <p id="selectedDiceDisplay">None selected</p>
        <button id="rollButton">Roll Dice</button>
      </section>
      <aside>
        <h2>Roll result</h2>
        <p id="ResultDisplay">No roll yet</p>
      </aside>
    </main>
    <script src="script.js"></script>
  </body>
</html>
